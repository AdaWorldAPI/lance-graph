name: Supersession index is current
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate-and-diff:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED by the provenance gate, not a convenience.
      # `actions/checkout@v4` defaults to depth 1, and MEASURED: a depth-1
      # clone whose head is ahead of the baseline does not contain the
      # baseline commit at all (`git rev-list --count HEAD` == 1). The gate
      # fails CLOSED on an unreachable baseline -- correctly -- so with the
      # default depth it would go red on every PR after the baseline landed,
      # for want of history rather than for want of provenance.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate and compare
        run: |
          python3 .claude/tools/supersession_index.py > /tmp/regen.md
          if ! diff -u .claude/board/SUPERSESSION-INDEX.md /tmp/regen.md; then
            echo
            echo "::error::SUPERSESSION-INDEX.md is stale."
            echo "It is GENERATED from ALL of:"
            echo "  .claude/plans/  +  crates/  +  .claude/v3/COMPONENT-MAP.md"
            echo "  .claude/board/entries/  +  .claude/board/EPIPHANIES.md"
            echo "so a plan naming a ruled symbol, a symbol added or deleted in"
            echo "crates/, OR a board entry citing a D-id can make it stale."
            echo "Regenerate and commit:"
            echo "  python3 .claude/tools/supersession_index.py > .claude/board/SUPERSESSION-INDEX.md"
            exit 1
          fi
          echo "index is current"
      # The transient tier's index is generated too, and by a SEPARATE
      # generator: `supersession_index.py` reads `entries/*.md` only to count
      # D-id coverage and never writes this table. One step, both gates --
      # staleness AND the three structural falsifiers (row with no file / file
      # with no row / duplicate id), which until now existed only as prose.
      - name: Entries index is current and structurally sound
        run: python3 .claude/tools/entries_index.py --check
      - name: Entries index generator self-test
        run: python3 .claude/tools/entries_index.py --self-test
      # Provenance for anything promoted to EPIPHANIES.md since the findings
      # baseline: the heading must name an entries/ file that EXISTS. Purely
      # structural -- it proves the route, never that the content is a Eureka
      # (that stays the closeout admission rule). Fails CLOSED if the baseline
      # revision is unreachable in a shallow clone, because an invisible delta
      # is not an empty one.
      - name: Post-baseline epiphanies cite their originating entry
        run: python3 .claude/tools/epiphany_provenance.py
      - name: Provenance gate self-test
        run: python3 .claude/tools/epiphany_provenance.py --self-test
