name: dir-sim persist
# lance-graph-dir-sim-lance stores the dir-sim history log in Lance. It is
# workspace-excluded (own [workspace] root, like lance-graph-dir-sim, which
# it depends on), so no other job builds it. Without this one a change to
# `lance_graph_dir_sim::log` or a lance bump could break it unnoticed.
#
# lance's build compiles .proto files: `protoc` alone is not enough, the
# well-known includes (libprotobuf-dev) are needed too.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - crates/lance-graph-dir-sim/**
      - crates/lance-graph-dir-sim-lance/**
      - crates/lance-graph-quack/**
      - crates/lance-graph-mask-risc/**
      - .github/workflows/dir-sim-persist.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  lance-log:
    name: dir-sim log in Lance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      - name: Checkout AdaWorldAPI/ndarray (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/ndarray
          path: ndarray
          persist-credentials: false
      - name: Checkout AdaWorldAPI/OGAR (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/OGAR
          path: OGAR
          persist-credentials: false
      - name: Install protoc and the protobuf includes (for lance)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      # `.cargo/config.toml` builds with target-cpu=native, and cargo's
      # fingerprint sees the flag text, not the CPU: an artifact built on a
      # runner with AVX-512 would be reused on one without and die with
      # SIGILL. Resolve `native` to this runner's CPU name and feature list:
      # a different CPU then gives different flags, cargo recompiles by itself,
      # and the cache is keyed to the same flags.
      - name: Resolve target-cpu=native for this runner
        id: cpu
        run: |
          flags=$(.github/scripts/resolve-native-rustflags.sh)
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          hash=$(printf %s "$flags" | sha256sum | cut -c1-16)
          echo "flags=$hash" >> "$GITHUB_OUTPUT"
          echo "native resolved to \`${flags%% *}\` (features $hash) for job \`$GITHUB_JOB\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.flags }}
          workspaces: lance-graph/crates/lance-graph-dir-sim-lance
      - name: clippy
        run: cargo clippy --manifest-path crates/lance-graph-dir-sim-lance/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path crates/lance-graph-dir-sim-lance/Cargo.toml
