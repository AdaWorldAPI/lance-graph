name: Rust Publish

on:
  release:
    types:
      - released
  pull_request:
    paths:
      - .github/workflows/rust-publish.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build & test only, release: build & publish to crates.io"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release

env:
  CARGO_TERM_COLOR: always
  # debuginfo=0, not 1. RUSTFLAGS are appended AFTER the flags cargo derives
  # from the profile, so a `debuginfo=1` here OVERRIDES `[profile.dev] debug = 0`
  # in Cargo.toml — the manifest default is silently defeated in CI, which is the
  # opposite of what it is for. CI never opens a debugger; `RUST_BACKTRACE=1`
  # below still yields a backtrace, just without line numbers.
  #
  # Four jobs already carried a job-level `debuginfo=0` for exactly this reason
  # (measured in b56bb2cd: ~930 MB -> ~252 MB per binary at link, -73%). They
  # keep the identical string, so their Swatinem cache keys are unchanged; the
  # jobs that until now INHERITED `=1` (style's clippy + format, rust-publish's
  # publish) get a new key and repopulate once.
  RUSTFLAGS: "-C debuginfo=0 -C target-cpu=x86-64-v3"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No `toolchain:` input — the action reads `rust-toolchain.toml`, so the
          # SHIPPED artifact is built with the pinned channel rather than whatever
          # `stable` is that week. Same shape style.yml already uses for rustfmt.
          components: rustfmt, clippy
          cache: false

      - uses: rui314/setup-mold@v1

      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: "--all-features"
          path: crates/lance-graph
          dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dry_run') }}
