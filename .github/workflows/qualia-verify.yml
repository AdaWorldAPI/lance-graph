name: Qualia archive verifiers
# The two verifiers guard the archived 219 musical annotations (#1607, #1608).
# They run under `python -O`, which strips `assert`, to prove they do not
# depend on it.
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifiers pass on the committed archive (optimized mode)
        run: |
          python3 -O data/qualia/verify_musical_anchors.py
          python3 -O data/qualia/verify_music_enrichment.py
      - name: Negative controls (optimized mode)
        run: python3 -O -m unittest discover -s data/qualia -p 'test_*.py' -v
