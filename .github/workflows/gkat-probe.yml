name: GKAT probe
# `crates/gkat-probe` (D-GKAT-0) is excluded from the workspace (own
# [workspace], zero dependencies), so no workspace job builds it.
on:
  pull_request:
    paths:
      - 'crates/gkat-probe/**'
      - '.github/workflows/gkat-probe.yml'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - 'crates/gkat-probe/**'
      - '.github/workflows/gkat-probe.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/gkat-probe
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
