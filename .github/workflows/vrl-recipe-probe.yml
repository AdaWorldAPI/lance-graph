name: VRL Recipe Probe
# Own [workspace] excluded from root tests; a lab gate, not production
# admission. Lowers the VRL read/rename/filter subset onto DT64's
# LaneBinding and one mask-risc program per terminal, and checks it against a
# naive VRL interpreter (D-VRL-RECIPE-0). The allocation test needs one test
# thread. ndarray arrives by git through mask-risc; no sibling checkout.
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  isolated-probe:
    name: excluded-crate fmt, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show
      - name: Resolve target-cpu=native for this runner
        id: cpu
        run: |
          flags=$(.github/scripts/resolve-native-rustflags.sh)
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          hash=$(printf %s "$flags" | sha256sum | cut -c1-16)
          echo "flags=$hash" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.flags }}
          workspaces: lance-graph/crates/vrl-recipe-probe
      - name: fmt
        run: cargo fmt --manifest-path crates/vrl-recipe-probe/Cargo.toml --check
      - name: clippy
        run: cargo clippy --release --manifest-path crates/vrl-recipe-probe/Cargo.toml --all-targets -- -D warnings
      - name: tests
        run: cargo test --release --manifest-path crates/vrl-recipe-probe/Cargo.toml -- --test-threads=1
