name: dt64 map table in Lance
# lance-graph-dt64-lance makes dt64's DR map table (dr::MapTable) durable
# through the supervisor's cycle writer over LanceCycleWriter.
# It is workspace-excluded (own [workspace] root), so no other job builds it.
# Without this one a change to dt64's dr module or a lance bump could break it
# unnoticed.
#
# lance's build compiles .proto files: `protoc` alone is not enough, the
# well-known includes (libprotobuf-dev) are needed too.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - crates/lance-graph-contract/**
      - crates/lance-graph-dt64/**
      - crates/lance-graph-dt64-lance/**
      # The map log is written through the cycle writer over LanceCycleWriter.
      - crates/lance-graph-supervisor/**
      - crates/lance-graph-planner/**
      - crates/lance-graph/src/graph/cycle_sink.rs
      - .github/workflows/dt64-map-table-lance.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  map-table:
    name: DR map table in Lance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      - name: Install protoc and the protobuf includes (for lance)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      # See dir-sim-persist.yml: spell target-cpu=native out as this runner's
      # feature list so the cache never reuses an artifact on another CPU.
      - name: Resolve target-cpu=native for this runner
        id: cpu
        run: |
          flags=$(.github/scripts/resolve-native-rustflags.sh)
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          hash=$(printf %s "$flags" | sha256sum | cut -c1-16)
          echo "flags=$hash" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.flags }}
          workspaces: lance-graph/crates/lance-graph-dt64-lance
      - name: fmt
        run: cargo fmt --manifest-path crates/lance-graph-dt64-lance/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path crates/lance-graph-dt64-lance/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path crates/lance-graph-dt64-lance/Cargo.toml
