name: Semantic ring reference oracle

# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert C-01/C-02 and negative controls
        run: |
          python3 tools/semantic_ring_oracle/ring_reference.py
          python3 -m unittest discover -s tools/semantic_ring_oracle -p 'test_*.py' -v
