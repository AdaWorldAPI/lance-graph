name: SAP CATS ABI
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/ndarray
          ref: master
          path: ndarray
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record tested substrate
        run: git -C ndarray rev-parse HEAD
      - name: Format
        run: cargo +stable fmt --manifest-path lance-graph/crates/lance-graph-sap/Cargo.toml -- --check
      - name: Lint
        run: cargo +stable clippy --manifest-path lance-graph/crates/lance-graph-sap/Cargo.toml --all-targets -- -D warnings
      - name: ABI and boundary tests
        run: cargo +stable test --manifest-path lance-graph/crates/lance-graph-sap/Cargo.toml
      - name: Executable CATS slice
        run: cargo +stable run --manifest-path lance-graph/crates/lance-graph-sap/Cargo.toml --example cats
