name: DR ISA Stream Lab
# Own [workspace] excluded from root tests; a lab gate, not production
# admission. GitHub runners have no AMX: the tests still prove the stream
# contract and the refusals on whatever tier the runner has, and the run log
# names that tier. AMX numbers come from a host that has it.
on:
  pull_request:
    paths:
      - "crates/dr-isa-stream-lab/**"
      - "crates/lance-graph-dt64/**"
      - "crates/lance-graph-contract/**"
      - ".github/workflows/dr-isa-stream-lab.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "crates/dr-isa-stream-lab/**"
      - "crates/lance-graph-dt64/**"
      - "crates/lance-graph-contract/**"
      - ".github/workflows/dr-isa-stream-lab.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  isolated-probe:
    name: excluded-crate fmt, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      - name: Checkout AdaWorldAPI/ndarray (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/ndarray
          path: ndarray
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show
      - name: Resolve target-cpu=native for this runner
        id: cpu
        run: |
          flags=$(.github/scripts/resolve-native-rustflags.sh)
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          hash=$(printf %s "$flags" | sha256sum | cut -c1-16)
          echo "flags=$hash" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.flags }}
          workspaces: lance-graph/crates/dr-isa-stream-lab
      - name: fmt
        run: cargo fmt --manifest-path crates/dr-isa-stream-lab/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path crates/dr-isa-stream-lab/Cargo.toml --all-targets -- -D warnings
      - name: tests (prints the GEMM tier)
        run: cargo test --release --manifest-path crates/dr-isa-stream-lab/Cargo.toml -- --nocapture
      - name: stage costs (every timed result is checked against the oracle)
        run: cargo run --release --manifest-path crates/dr-isa-stream-lab/Cargo.toml --bin bench
      - name: virtual-shape costs, 64x64 and 256x256 (every arm checked against the oracle)
        run: cargo run --release --manifest-path crates/dr-isa-stream-lab/Cargo.toml --bin shape
