name: Identity
# Two jobs for two different contracts, kept apart on purpose:
#
#   exchange-fidelity  lance-graph-dir-sim simulates hybrid Exchange. Its
#                      behaviour follows what Exchange and AD actually do:
#                      recipient types, routing addresses, proxy addresses,
#                      joins on the object GUID.
#   iam-immutability   lance-graph-rbac authorizes on an immutable principal.
#                      Delegation (RFC 8693 `act`) names who acts, never
#                      whose authority is used.
#
# The simulator must not take on IAM's rules (an address is not an identity
# there; it is an Exchange attribute with Exchange's lifecycle), and IAM must
# not take on the simulator's (an address never decides who a principal is).
#
# Each job runs its whole crate, then checks that the tests pinning the
# contract still exist by name. A renamed or deleted pinning test fails the
# job instead of silently dropping out of the run.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - crates/lance-graph-dir-sim/**
      - crates/lance-graph-rbac/**
      - crates/lance-graph-contract/**
      - crates/lance-graph-quack/**
      - crates/lance-graph-mask-risc/**
      - .github/workflows/identity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  exchange-fidelity:
    name: Exchange dir-sim fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      # lance-graph-dir-sim is workspace-excluded: it path-deps OGAR
      # (ogar-dir-core / ogar-dir-sim / ogar-ad) and, through mask-risc,
      # ndarray. Both are NO-PIN sibling checkouts, as in rust-test.yml.
      - name: Checkout AdaWorldAPI/ndarray (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/ndarray
          path: ndarray
          persist-credentials: false
      - name: Checkout AdaWorldAPI/OGAR (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/OGAR
          path: OGAR
          persist-credentials: false
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lance-graph/crates/lance-graph-dir-sim
      - name: Run the simulator's tests
        run: cargo test --manifest-path crates/lance-graph-dir-sim/Cargo.toml
      - name: The tests pinning Exchange behaviour exist
        run: |
          cargo test -q --manifest-path crates/lance-graph-dir-sim/Cargo.toml -- --list \
            > "$RUNNER_TEMP/tests.txt"
          missing=0
          while read -r name; do
            [ -z "$name" ] && continue
            if ! grep -Fxq "$name: test" "$RUNNER_TEMP/tests.txt"; then
              echo "::error::missing pinning test: $name"
              missing=1
            fi
          done <<'EOF'
          enabling_a_mailbox_stamps_its_routing_proxy
          leftover_mail_addresses_of_a_non_recipient_claim_nothing_but_its_upn_does
          a_group_does_not_collide_with_a_non_recipients_leftovers
          an_introduced_routing_address_must_match_the_alias
          the_routing_address_must_be_the_nodes_own_alias
          the_routing_address_must_be_a_proxy
          the_prefix_names_the_kind_and_the_case_of_smtp_marks_the_primary
          from_ad_reads_the_triplet_and_strips_smtp
          a_synchronized_user_is_mirrored_and_a_cloud_only_user_is_synthetic
          a_mirrored_user_inside_the_synthetic_container_is_refused
          an_unencoded_on_premises_dn_is_refused_not_made_synthetic
          mailbox_records_are_not_observed_as_users
          a_cloud_read_is_shown_mirrored_and_synthetic
          a_simulated_version_marks_what_it_created
          unsafe_values_are_base64_and_long_lines_fold
          iam_filters_entries_and_attributes
          writes_are_refused_and_the_directory_does_not_change
          the_root_dse_is_public_and_the_tree_is_not
          deep_filters_are_refused_before_they_recurse
          critical_controls_are_refused_and_others_ignored
          wide_filters_are_refused
          out_of_range_limits_are_refused_without_panicking
          a_rebind_refused_for_a_control_drops_the_identity
          a_disabled_shared_mailbox_still_receives
          departure_by_conversion_to_shared_keeps_the_mailbox
          an_unknown_lifecycle_is_not_a_recipient
          casing_does_not_change_the_identity
          identity_not_ordinal_reaches_change_diff_plan_and_provenance
          a_mail_on_another_object_is_a_label_not_a_claim
          a_mail_label_on_another_object_is_not_a_claim
          a_departed_user_holds_no_address_and_receives_nothing
          offboarding_by_disable_remote_mailbox_stops_delivery
          a_remote_mailbox_with_its_cloud_mailbox_receives
          a_remote_mailbox_without_a_cloud_mailbox_receives_nothing
          two_cloud_mailboxes_are_not_one
          contradicting_witnesses_are_not_a_mailbox
          an_on_premises_mailbox_needs_no_cloud_mailbox
          the_cloud_never_revives_a_non_recipient
          an_empty_on_premises_exchange_guid_awaits_backsync
          a_matching_exchange_guid_is_migratable
          a_mismatched_exchange_guid_blocks_the_cloud_mailbox
          an_unread_or_ambiguous_cloud_exchange_guid_decides_nothing
          the_exchange_guid_comparison_needs_a_remote_mailbox_in_the_cloud
          identity_is_read_by_guid
          mail_hydrates_no_identity
          mail_is_a_business_card_property_as_written
          mail_follows_the_user_through_offboarding
          no_mailbox_no_exchange_guid
          from_ad_reads_the_exchange_guid_from_schema_6_only
          EOF
          exit "$missing"

  iam-immutability:
    name: IAM immutability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      # lance-graph-rbac itself depends only on lance-graph-contract, but it
      # is a workspace member, and loading the workspace reads every member's
      # manifest, including the ones that path-dep ndarray and OGAR.
      - name: Checkout AdaWorldAPI/ndarray (sibling, needed to load the workspace)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/ndarray
          path: ndarray
          persist-credentials: false
      - name: Checkout AdaWorldAPI/OGAR (sibling, needed to load the workspace)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/OGAR
          path: OGAR
          persist-credentials: false
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lance-graph/crates/lance-graph-rbac
      - name: Run the IAM tests
        run: cargo test --manifest-path crates/lance-graph-rbac/Cargo.toml
      - name: The tests pinning the immutable principal exist
        run: |
          cargo test -q --manifest-path crates/lance-graph-rbac/Cargo.toml -- --list \
            > "$RUNNER_TEMP/tests.txt"
          missing=0
          while read -r name; do
            [ -z "$name" ] && continue
            if ! grep -Fxq "$name: test" "$RUNNER_TEMP/tests.txt"; then
              echo "::error::missing pinning test: $name"
              missing=1
            fi
          done <<'EOF'
          auth::tests::resolved_identity_feeds_authorize
          auth::tests::a_delegated_identity_authorizes_as_the_principal
          auth::tests::an_undelegated_identity_acts_as_itself
          auth::tests::the_outermost_act_is_the_current_actor
          auth::tests::a_provider_without_tokens_cannot_be_delegated
          auth::tests::the_acting_party_keeps_its_issuer
          EOF
          exit "$missing"
