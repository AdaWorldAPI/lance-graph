name: Codegraph index is current
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:
jobs:
  codegraph-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Self-test (falsifiers)
        run: python3 .claude/tools/codegraph_index.py --self-test
      - name: Index matches the tree
        run: python3 .claude/tools/codegraph_index.py --check
