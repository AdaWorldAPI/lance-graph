name: ACT-R production arbitration
# `crates/lance-graph-act-r` is a standalone crate (own [workspace], listed in
# the root `exclude`), so no workspace job builds it. Without this job its
# tests never run.
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  act-r:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --manifest-path crates/lance-graph-act-r/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path crates/lance-graph-act-r/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path crates/lance-graph-act-r/Cargo.toml
