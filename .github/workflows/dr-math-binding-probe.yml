name: DR Mathematical Binding Probe
on:
  push:
    paths:
      - "crates/dr-math-binding-probe/**"
      - "crates/lance-graph-contract/**"
      - "crates/lance-graph-act-r/**"
      - ".github/workflows/dr-math-binding-probe.yml"
  pull_request:
    paths:
      - "crates/dr-math-binding-probe/**"
      - "crates/lance-graph-contract/**"
      - "crates/lance-graph-act-r/**"
      - ".github/workflows/dr-math-binding-probe.yml"
jobs:
  isolated-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path crates/dr-math-binding-probe/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/dr-math-binding-probe/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path crates/dr-math-binding-probe/Cargo.toml
