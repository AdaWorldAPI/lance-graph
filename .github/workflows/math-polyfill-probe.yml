name: Math Polyfill Probe (D-MPF-1)
# Own [workspace] excluded from root tests; a lab gate, not production
# admission. Mirrors egglog-r2il-probe.yml's toolchain setup: the pinned
# toolchain from rust-toolchain.toml, never `stable`.
on:
  pull_request:
    paths:
      - "crates/math-polyfill-probe/**"
      - "crates/lance-graph-contract/**"
      - "crates/lance-graph-r2il/**"
      - "crates/lance-graph-relalg/**"
      - "crates/lance-graph-mask-risc/**"
      - ".github/workflows/math-polyfill-probe.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "crates/math-polyfill-probe/**"
      - "crates/lance-graph-contract/**"
      - "crates/lance-graph-r2il/**"
      - "crates/lance-graph-relalg/**"
      - "crates/lance-graph-mask-risc/**"
      - ".github/workflows/math-polyfill-probe.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  isolated-probe:
    name: excluded-crate fmt, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show
      - name: Resolve target-cpu=native for this runner
        id: cpu
        run: |
          flags=$(.github/scripts/resolve-native-rustflags.sh)
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          hash=$(printf %s "$flags" | sha256sum | cut -c1-16)
          echo "flags=$hash" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.flags }}
          workspaces: lance-graph/crates/math-polyfill-probe
      - name: fmt
        run: cargo fmt --manifest-path crates/math-polyfill-probe/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path crates/math-polyfill-probe/Cargo.toml --all-targets -- -D warnings
      - name: tests
        run: cargo test --release --manifest-path crates/math-polyfill-probe/Cargo.toml
      - name: cost split (reported, not gated)
        run: cargo run --release --example cost_split --manifest-path crates/math-polyfill-probe/Cargo.toml
