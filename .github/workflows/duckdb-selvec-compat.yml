name: DuckDB SelectionVector Compat
# Own [workspace] excluded from root tests; a lab gate, not production.
on:
  pull_request:
    paths:
      - "crates/duckdb-selvec-compat/**"
      - "crates/lance-graph-mask-risc/**"
      - ".github/workflows/duckdb-selvec-compat.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "crates/duckdb-selvec-compat/**"
      - "crates/lance-graph-mask-risc/**"
      - ".github/workflows/duckdb-selvec-compat.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --manifest-path crates/duckdb-selvec-compat/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/duckdb-selvec-compat/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --manifest-path crates/duckdb-selvec-compat/Cargo.toml
      # The same C fixture against the pinned real libduckdb (sha256-checked
      # download) and against the adapter, in two processes.
      - name: Differential run against DuckDB v1.5.6
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
          bash crates/duckdb-selvec-compat/harness/run.sh "$RUNNER_TEMP/selvec"
