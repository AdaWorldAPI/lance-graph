# surreal_container tests, on demand.
#
# The crate has no dependent in the workspace. Its tests used to run in
# `rust-test.yml`'s `member-tests` job on every PR, where they recompiled the
# lance stack for more than five minutes and pushed that job over its limit.
# They run here instead, only when the crate, the contract crate it uses
# (`kanban`, `scheduler`, `soa_view`, `collapse_gate`), the workspace manifest,
# or this workflow changes. `member-tests` still compiles the crate through
# `cargo build --workspace`.
name: surreal_container
on:
  push:
    branches:
      - main
    paths:
      - crates/surreal_container/**
      - crates/lance-graph-contract/**
      - Cargo.toml
      - .github/workflows/surreal-container.yml
  pull_request:
    paths:
      - crates/surreal_container/**
      - crates/lance-graph-contract/**
      - Cargo.toml
      - .github/workflows/surreal-container.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lance-graph
    steps:
      - uses: actions/checkout@v4
        with:
          path: lance-graph
      - name: Checkout AdaWorldAPI/ndarray (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/ndarray
          path: ndarray
      - name: Checkout AdaWorldAPI/OGAR (sibling dependency, NO-PIN path deps)
        uses: actions/checkout@v4
        with:
          repository: AdaWorldAPI/OGAR
          path: OGAR
      - name: Setup rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Setup mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      # Never a named CPU level on a hosted runner: the fleet is mixed (one
      # worker has AVX-512, the next stops at AVX2), so each job detects its own
      # CPU and builds for exactly that. The flags are spelled out as a feature
      # list so cargo and the cache see a different CPU as different flags.
      - name: Resolve target-cpu=native for this runner
        id: cpu
        run: |
          flags=$(.github/scripts/resolve-native-rustflags.sh -C debuginfo=0)
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          hash=$(printf %s "$flags" | sha256sum | cut -c1-16)
          echo "flags=$hash" >> "$GITHUB_OUTPUT"
          echo "native is `$(.github/scripts/resolve-native-rustflags.sh --cpu)`, features $hash, job `$GITHUB_JOB`" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.flags }}
          shared-key: "lance-graph-surreal-container"
          workspaces: |
            lance-graph
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Run surreal_container tests   # 5 + 5 green
        run: cargo test --manifest-path crates/surreal_container/Cargo.toml
