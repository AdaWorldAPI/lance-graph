# lance-graph cargo config — mirrors ndarray's `.cargo/config.toml` policy
# (operator ruling, 2026-09-02): GitHub needs v3; everything else v4 or native.
#
# ndarray is the MANDATORY execution substrate for every crate here, and its
# `simd.rs` dispatch is COMPILE-TIME (`cfg(target_feature = "avx512f")` /
# `"avx2"`). Whatever `target-cpu` this build runs at decides which backend
# `ndarray::simd::{F64x8, F32x16, I16x32}` resolves to. `.cargo/config.toml`
# is read from the INVOKING directory, not the dependency's — so ndarray's
# own config does NOT apply when a lance-graph crate is built from here.
# Without this file a local build compiles the substrate at generic x86-64
# (SSE2), i.e. the scalar arm.
#
# Measured on the Goursat wavefront (crates/jc/examples/goursat_substrate_probe,
# 4097-point paths, release): under v4 `F64x8::mul_add` is 8.6x faster than
# the flat scalar loop; at generic x86-64 the SAME code is 4.5x SLOWER than
# scalar, because the polyfill's scalar arm is emulating eight lanes through
# arrays. A build with no target-cpu is a regression, not a no-op.
#
# ⊘ SUPERSEDED 2026-10-12: the default here WAS v3 (AVX2), "for the same
# reason ndarray chose it". ndarray itself flipped its default to `native` on
# 2026-09-16 (see its `.cargo/config.toml`): a default that names a tier the
# host is not makes every faster-tier measurement need an incantation, and a
# forgotten one does not fail, it grades the wrong tier. Measured here the
# same way: a cost probe under this file reported AVX2 timings on an AVX-512
# host with nothing in the output saying so.
#
# Default is now `native`: rustc resolves the host CPUID, so the polyfill
# compiles to the arm this machine can run and can never SIGILL here. A
# measurement is labelled by the arm the program reports
# (`cfg!(target_feature = "avx512f")`), never by "it was the default".
#
# A default build is therefore tuned to the BUILD HOST and is NOT portable.
# Anything shipped pins its tier explicitly:
#
#   portable baseline (AVX2):  cargo build --config .cargo/config-v3.toml ...
#   AVX-512 (v4):              cargo build --config .cargo/config-avx512.toml ...
#
# CI is unaffected: every workflow sets `RUSTFLAGS` with an explicit
# `-C target-cpu=x86-64-v3`, and a RUSTFLAGS env REPLACES every cargo-config
# rustflags entry. Everything else that ships pins x86_64 to v3 without
# touching other architectures: the Dockerfiles that copy this tree replace
# this file with config-v3.toml (x86_64-only), the thinking-engine images set
# CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS, and `make publish` in
# python/ sets RUSTFLAGS only on an x86_64 host. Note that the per-target
# variable is JOINED with this file's entry, with `native` last (measured), so
# it cannot pin a build that sees this file. Anything below v3 still SIGILLs on the
# `simd_avx2` intrinsics, so never build with no target-cpu at all.
#
# The two crypto cfgs ndarray's config also carries (`curve25519_dalek_backend`,
# `poly1305_force_soft`) are deliberately NOT repeated: neither crate is in
# this workspace's Cargo.lock (verified 2026-09-02, 0 hits), so there is no
# AVX2 crypto surface here to compile out. Re-check if `encryption` or
# `ed25519-dalek` ever enters the tree.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-cpu=native"]

# Debug info off for every dev/test build under this tree, including the
# crates that are their own workspace (19 of them: they never see the root
# Cargo.toml's `[profile.dev] debug = 0`). Debug info is what fills the disk,
# not the code. A config-file profile overrides a manifest profile; an
# explicit CARGO_PROFILE_* env var still overrides this. Release profiles are
# left to each crate.
[profile.dev]
debug = 0

[profile.test]
debug = 0
