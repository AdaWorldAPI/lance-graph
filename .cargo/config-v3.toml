# Portable distribution baseline: x86-64-v3 (AVX2), every x86_64 since
# Haswell. REQUIRED for anything shipped from this tree, now that the default
# `.cargo/config.toml` is `native`. Mirrors ndarray/.cargo/config-v3.toml.
#   cargo build --config .cargo/config-v3.toml ...
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-cpu=x86-64-v3"]
