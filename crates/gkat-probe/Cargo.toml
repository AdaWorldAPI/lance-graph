[package]
name = "gkat-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "D-GKAT-0 PROBE: a bounded research fixture for Guarded Kleene Algebra with Tests (Smolka et al., POPL 2020). Decides equivalence of structured guarded flows over a declared atom set of at most 256 atoms, checks a separate RequestCommit safety property, and refuses constructs outside the admitted fragment. Not a production verifier, runtime or executor."

# Its own workspace root, excluded from the lance-graph workspace. Zero
# dependencies on purpose: the probe must not become a runtime dependency of
# anything. Run from this directory:
#   cd crates/gkat-probe && cargo test
[workspace]

[dependencies]
