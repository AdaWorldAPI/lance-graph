# VRL recipe probe: a lab probe, NOT a workspace member, NOT a runtime.
# Lowers the read/rename/filter subset of Vector's VRL onto the existing
# witnessed path: a WideFieldMask of fields bound through DT64's LaneBinding,
# and one mask-risc program per terminal. Checked against a naive VRL
# interpreter over materialized events. Run with
#   cargo test --release --manifest-path crates/vrl-recipe-probe/Cargo.toml
[package]
name = "vrl-recipe-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Compiles a read/rename/filter subset of VRL into a stored late-materialization recipe and checks it against a naive VRL interpreter."

[workspace]

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
# The witness (FrameStore / BindStore / LaneBinding) and the fold
# (mask-risc over ndarray::simd) are the existing D-DR-SELECT-K-SV path;
# this probe adds only the VRL lowering in front of them.
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
# The recipe core (compile, prepare, run, positional Rows) lives here now; this
# probe keeps the reference interpreter and the parity tests.
lance-graph-vrl = { path = "../lance-graph-vrl" }

[dev-dependencies]
# The r2il parity test only (tests/r2il_parity.rs): the same recipe as frozen
# F000 words, run through r2il's prepare/run. Execution never goes this way;
# r2il is the inspectable reading (binding.rs module doc, the §20 correction).
lance-graph-r2il = { path = "../lance-graph-r2il" }

[patch."https://github.com/AdaWorldAPI/lance-graph"]
# r2il reaches OGAR's crates, which name the contract by git; without this the
# test would link two contract packages (the root workspace does the same).
lance-graph-contract = { path = "../lance-graph-contract" }
