[package]
name = "weather-poc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Zarr -> NodeRow: the ERA5 0.25-degree global grid baked onto the canonical 512-byte SoA row. One cell = one node (HEEL = 16-degree tile, HIP = within-tile), one timestep = one Lance version. Plan: .claude/plans/weather-soa-bake-v1.md"

# Standalone research crate, EXCLUDED from the lance-graph workspace. Default
# builds remain genuinely zero-dependency:
#   cargo test --manifest-path crates/weather-poc/Cargo.toml
#
# The `canonical-row` feature is a deliberately opt-in AGREEMENT seam to the
# sibling contract crate. It exists so D-WXS-4 can place the W1 facet image in
# the LIVE append-only value carve instead of copying today's free-tail offset
# into this standalone crate. This is different from the historical helix path
# trap: `lance-graph-contract` is a sibling in this repository, while helix's
# mandatory ndarray path may not exist in a clean checkout.
#
# `helix::quantize::RollingFloor` remains intentionally NOT a dependency. The
# linear formula is re-expressed in floor.rs and parity is a measured gate.

[features]
default = []
canonical-row = ["dep:lance-graph-contract"]

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract", optional = true }

# Bar B6/B7 require jc::reliability::spearman specifically. jc is itself
# zero-external-dep by default, so this dev edge does not pull the heavy stack
# into production builds.
[dev-dependencies]
jc = { path = "../jc" }

[lib]
name = "weather_poc"
path = "src/lib.rs"
