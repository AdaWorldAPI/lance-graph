[package]
name = "lance-graph-python"
version = "0.5.4"
edition = "2021"
authors = ["Lance Devs <dev@lancedb.com>"]
publish = false

[lib]
name = "_internal"
crate-type = ["cdylib"]

[dependencies]
# Exact pins, lockstep with the workspace (see root Cargo.toml).
arrow = { version = "=58.4.0", features = ["pyarrow"] }
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
arrow-ipc = "=58.4.0"
datafusion = { version = "=54.1.0", default-features = false }
futures = "0.3"
lance-graph = { path = "../lance-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39", "py-clone"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
