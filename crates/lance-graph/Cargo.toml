[package]
name = "lance-graph"
version = "0.5.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-graph"
readme = "README.md"
description = "Graph query engine for Lance datasets with Cypher support"
keywords = ["lance", "graph", "cypher", "query", "datafusion"]
categories = ["database", "data-structures", "science"]

[dependencies]
# arrow + datafusion bumped to 58 + 53 to align with lance 6.0's transitive versions.
# TODO(lance-bump): downstream crates may need follow-up to align.
arrow = { version = "58", features = ["prettyprint"] }
arrow-array = "58"
arrow-schema = "58"
chrono = "0.4"
async-trait = "0.1"
datafusion = { version = "54", default-features = false, features = [
    "nested_expressions",
    "regex_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "datetime_expressions",
    "string_expressions",
    "parquet",
] }
datafusion-common = "54"
datafusion-expr = "54"
datafusion-sql = "54"
datafusion-functions-aggregate = "54"
futures = "0.3"
lance-graph-catalog = { path = "../lance-graph-catalog", version = "0.5.4" }
lance-graph-contract = { path = "../lance-graph-contract" }
lance = "=9.0.0"
lance-linalg = "=9.0.0"
lance-namespace = "=9.0.0"
lancedb = { version = "=0.33.0", optional = true, default-features = false }
nom = "7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Boot config ONLY (`soa_config`): the `.config/<repo>/config.yaml` a deployment
# reads once at startup. Not a hot-path serialization surface — same category as
# lance-graph-contract's build.rs manifest parse, which already pins this
# version. Kept at 0.9 to match that sibling rather than introducing a second
# YAML implementation into one workspace.
serde_yaml = "0.9"
bytes = "1"
snafu = "0.8"

# AdaWorldAPI/ndarray fork with 55 HPC modules (Fingerprint, CAM-PQ, CLAM, BLAS, ZeckF64)
# Source: https://github.com/AdaWorldAPI/ndarray
ndarray = { path = "../../../ndarray", optional = true, default-features = false, features = ["std", "hpc-extras"] }

# Unified query planner (MUL, thinking, strategies, CAM-PQ scan)
lance-graph-planner = { path = "../lance-graph-planner", optional = true }

# Counterfactual (Pearl rung 3) for the `reasoning` consumer facade. Folded in
# behind the SAME `planner` feature deliberately: a consumer reaching the
# reasoning seam should add ONE dependency, not two, and `lance-graph-cognitive`
# is light (ndarray + holograph + contract, all already in this tree).
lance-graph-cognitive = { path = "../lance-graph-cognitive", optional = true }

# bgz17: palette semiring codec (0 deps, 121 tests)
bgz17 = { path = "../bgz17", optional = true }

# bgz-tensor: attention as table lookup, SimilarityTable, variance audit
bgz-tensor = { path = "../bgz-tensor", optional = true }

[features]
default = ["unity-catalog", "ndarray-hpc", "planner", "bgz17-codec", "tensor-codec"]
unity-catalog = ["lance-graph-catalog/unity-catalog"]
# The `delta` feature (deltalake + DeltaTableReader) was REMOVED 2026-08-18
# (operator pin ruling: lance 9 / lancedb 0.33 / datafusion 54.1 — NO DF 53 —
# / arrow 58). deltalake tops out at 0.32.4 pinning datafusion ^53.1.0, so the
# feature was the sole source of the DF-53 duplicate major in Cargo.lock; it
# was also already non-default AND documented broken (0.32 removed
# `DeltaTableProvider::try_new`). CORRECTION (same day, operator-pointed):
# delta-rs MAIN already pins datafusion 54 + arrow 58 (verified 2026-08-18
# from delta-io/delta-rs main Cargo.toml) — only the crates.io releases top
# out at DF 53. Restoration is therefore available NOW via the house
# mechanism (git dep on the upstream repository, pinned to a rev) + a reader
# refactor to the current builder API — as its own deliberate PR if a
# consumer needs Delta. The removal itself stands ("we don't need
# deltalake").
# lancedb: high-level table/connection API (Python/JS SDK equivalent in Rust).
# Enables LanceDB-compatible connection strings, table management, and the
# vector search API surface that third-party tooling (DuckDB ext, Polars) expects.
lancedb-sdk = ["dep:lancedb"]
# ndarray-hpc: use AdaWorldAPI/ndarray for Fingerprint<256>, CAM-PQ, CLAM, BLAS, ZeckF64.
# Disable for minimal builds (CI, wasm, embedded) — falls back to standalone ndarray_bridge.rs.
ndarray-hpc = ["dep:ndarray"]
# with-cam-pq: enables WitnessIndexCamPq (real ndarray::hpc::cam_pq wiring) in WitnessCorpus.
# Requires ndarray-hpc. HashMap-only users (no with-cam-pq) pay zero cost — no ndarray dep
# for the witness index path unless this feature is enabled.
# OQ-CSV-12: lazy enable_cam_pq() API; WitnessCorpus::new() stays cheap.
with-cam-pq = ["ndarray-hpc"]
# planner: wire lance-graph-planner for query classification, thinking styles, MUL gate.
planner = ["dep:lance-graph-planner", "dep:lance-graph-cognitive"]
# bgz17-codec: palette semiring, HHTL distance matrix, SPO tripartite search.
bgz17-codec = ["dep:bgz17"]
# tensor-codec: attention as table lookup, SimilarityTable, Belichtungsmesser, variance audit.
tensor-codec = ["dep:bgz-tensor"]
# lite-unified: ADDITIVE, default-OFF coexistence gate for the SurrealQL-on-lance
# query path (.claude/plans/lite-unified-surrealql-lance-v1.md). PROCESS, NOT A
# SWITCH — datafusion stays the DEFAULT query engine and is NOT deprecated, NOT
# made optional by this feature. `lite-unified` only adds the SurrealQL lowering
# path ALONGSIDE datafusion, promoted gradually per query-shape once OQ-LU-2a
# (the datafusion_planner coverage probe) is green. Empty until the lowering lands.
lite-unified = []

[dev-dependencies]
deepnsm = { path = "../deepnsm" }
lance-graph-contract = { path = "../lance-graph-contract" }
futures = "0.3"
lance-arrow = "=9.0.0"
lance-index = "=9.0.0"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
causal-edge = { path = "../causal-edge" }
lance-graph-planner = { path = "../lance-graph-planner" }
# Same 0.13.2 already resolved transitively via lance/lance-io/lancedb — this
# adds a direct edge to an already-locked version, not a new resolution. Only
# `object_store::path::Path` is named directly (hydration_probe's byte-mirror
# upload needs to build a multi-segment relative path; `Path::from` parses one,
# `ObjectStore::put`'s single-segment `.join` does not).
#
# `aws` is declared HERE rather than inherited. It is already on in every
# current build — but only via `lance`'s DEFAULT features
# (`lance/default` → `lance/aws` → `lance-io/aws` → `object_store/aws`), which
# is a dependency of convenience, not of contract. `lance`'s defaults also pull
# azure + gcp + oss + huggingface + tencent + tos + goosefs + geo, so slimming
# them to `default-features = false` is a plausible future move — and it would
# silently remove S3 from THIS crate's own S3 callers (`dev_s3_env.rs`,
# `examples/hydration_probe.rs`, `examples/soa_to_lance.rs`, the `soa_verbatim`
# test), which name the S3 environment directly and have nothing to do with
# lance's cloud-backend selection. Declaring it changes no resolved feature
# today (cargo unifies it with what lance-io already turns on); it makes the
# capability this crate USES a thing this crate ASKS FOR. Same declaration q2's
# `cockpit-server` already carries for the same reason.
object_store = { version = "0.13", features = ["aws"] }
