# D-DRMC-1: isolated, non-production structural binding probe.
[package]
name = "dr-math-binding-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Borrowed DR64 / ClassView-style typed structure and source witness admission probe; never executes population rows."

[workspace]

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
# The proof route for D-DRMC-5: public API only (EGraph::new_with_proofs,
# parse_and_run_program, `prove`). egglog checks every proof it returns.
egglog = { git = "https://github.com/AdaWorldAPI/egglog", branch = "main" }

[dev-dependencies]
lance-graph-act-r = { path = "../lance-graph-act-r" }
