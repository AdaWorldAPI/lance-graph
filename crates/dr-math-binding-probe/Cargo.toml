# D-DRMC-1: isolated, non-production structural binding probe.
[package]
name = "dr-math-binding-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Borrowed DR64 / ClassView-style typed structure and source witness admission probe; never executes population rows."

[workspace]

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
# The proof route for D-DRMC-5: public API only (EGraph::new_with_proofs,
# parse_and_run_program, `prove`, the read-only `egglog::proof` module).
# egglog checks every proof it returns with its own checker; that check is
# egglog's, not an independent one.
# Floats on `main` (2026-11-08: internal pins are prohibited; this replaces the
# 2026-11-02 one-commit pin). Every crate that links egglog names the same
# branch, so cargo still sees one source; a branch and a rev would be two.
egglog = { git = "https://github.com/AdaWorldAPI/egglog", branch = "main" }
# Compiled identity of a certified lowering (relcomp::lowering_digest).
sha2 = "0.10"
# D-NFR-1 (src/nfr1.rs): mapping replay and admission over the DR
# versioned mapping (MapTable, Frame). The library names dt64 only.
lance-graph-dt64 = { path = "../lance-graph-dt64" }

[dev-dependencies]
lance-graph-act-r = { path = "../lance-graph-act-r" }
# D-DRCA-2 (tests/dr256_where_dr3.rs, examples/dr256_where_stages.rs): the
# real WHERE path. Quack binds and lowers, mask-risc executes the `Keep`
# terminal; the library itself never names either.
lance-graph-quack = { path = "../lance-graph-quack" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
