[package]
name = "lance-graph-contract"
version = "0.1.0"
edition = "2021"
description = "Thin contract crate: traits + types for lance-graph consumers (ladybug-rs, crewai-rust, n8n-rs)"
license = "Apache-2.0"
keywords = ["lance", "graph", "contract", "orchestration", "thinking"]
build = "build.rs"

[dependencies]
# Zero dependencies by design — this is a trait-only crate, and it MUST stay
# dependency-free even of optional path deps: as a WORKSPACE MEMBER, any path
# dep here (optional or not) is resolved at workspace-load time, so a missing
# sibling checkout breaks EVERY cargo invocation in CI (learned 2026-07-07:
# an optional ../../../OGAR dep killed the whole PR pipeline). The armed
# mirror↔vocab fuse + live-vocab re-export live in the workspace-EXCLUDED
# `lance-graph-ogar` crate instead, which already path-deps ogar-vocab.

[build-dependencies]
# serde_yaml: used ONLY in build.rs to parse modules/*/manifest.yaml.
# This does NOT become a runtime dep of the crate.
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
glob = "0.3"

[dev-dependencies]
# Used in manifest_codegen tests to replicate validation logic in-process.
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
# D-CSV-13b: criterion bench scaffold for i4_eval::batch SIMD dispatch.
# Matches version used in crates/lance-graph-benches/Cargo.toml.
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "i4_batch"
harness = false

[features]
# No default features. The V2/V3 tail is unconditional since D-HPR-6a
# (2026-10-11); `--no-default-features` and a default build compile the same.
default = []

# A-unlock-stepdomain — `step_trajectory_hash` forward stub for the E4
# cross-PR bridge between PR #278 audit log + PR #279 grammar trajectory.
# No-op alias today; concrete impl lands once the bridge PR ships.
trajectory-audit = []

# guid-v2-tail / guid-v3-tail — EMPTY since D-HPR-6a (2026-10-11). They gated
# the v2/v3 tail constructor (`new_v2`), the five V3 classid constants and the
# `codebook` module; all of that is now unconditional. The names stay so the
# consumers that request them (deepnsm-v2, MedCare-rs, q2) still resolve.
# `new_v2` writes the same 16 bytes `facet::FacetCascade` holds
# (`classid(4) | 6×(8:8)`, lo = is_a, hi = part_of); see
# `canonical_node::v3_mint_is_the_128_bit_facet`.
guid-v2-tail = []
guid-v3-tail = []

# tenant-counters — per-ValueTenant update counters for debug instrumentation of
# the SoA write cascade (the capstone NaN-census / seam-wiring measurement). OFF
# by default: `tenant_counter::tenant_update` is a zero-cost no-op unless enabled
# (compile-time dispatch). On: one relaxed atomic increment per tenant write.
tenant-counters = []
