[package]
name = "perturbationsfeld-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "D-PFP-1 probe: does the thinking-engine's perturbation field, lowered through lance-graph-mask-risc as a 1-D aperture (row == codebook id), change what the next cycle retains versus today's top_k window? Also measures whether the engine is input-sensitive at all on the tracked 256x256 tables. Probe-only; workspace-excluded. Unrelated to crates/perturbation-sim (a power-grid simulator). Spec: .claude/plans/perturbationsfeld-probe-v1.md section 9; constants: PREREG.md."

# Probe-only: excluded from the workspace so no member gains a dependency for a
# measurement. Run with:
#   cargo run --release --manifest-path crates/perturbationsfeld-probe/Cargo.toml
#   cargo test           --manifest-path crates/perturbationsfeld-probe/Cargo.toml
[workspace]

[dependencies]
thinking-engine = { path = "../thinking-engine", default-features = false }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
