[package]
name = "lance-graph-vrl"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
publish = false
license = "MIT OR Apache-2.0"
description = "VRL recipes over the register contract (not Magic Sets / crepe, not the NARS tactic recipes): the read/rename/filter subset of VRL compiled into a stored recipe (bound fields, abort terms, output aliases), run as one mask-risc program over lanes lent by one DT64 borrow_all (prepare once, then run_into; the convenience terminals check the witness again to size the program), answered as positional rows (names once, borrowed lanes, a u32 position table)."

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
# The witness (FrameStore / BindStore / LaneBinding) and the fold (mask-risc over
# ndarray::simd) are the existing D-DR-SELECT-K-SV path; this crate adds only the
# recipe lowering in front of them.
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }

# The S1 upstream differential only (tests/upstream.rs): the same programs run
# by upstream VRL, one pin per consumer. Optional, so a default build never
# compiles VRL. The AdaWorldAPI fork carries both commits; the revs are
# pinned on purpose, because the differential is against a named release.
# Vector's lock (vector c879bd6): vrl 0.39.0 at 7738f74.
vrl-vector = { package = "vrl", git = "https://github.com/AdaWorldAPI/vrl.git", rev = "7738f74e039df4d92ee5370d1f0d7d522f73e97a", default-features = false, features = ["compiler", "stdlib-base"], optional = true }
# OpenObserve's: vrl 0.31.0 (the v0.31.0 release commit 4d61e53).
vrl-o2 = { package = "vrl", git = "https://github.com/AdaWorldAPI/vrl.git", rev = "4d61e53334cb373b1cf5129d3963145bd5bff6d0", default-features = false, features = ["compiler", "stdlib-base"], optional = true }

[features]
upstream-vector = ["dep:vrl-vector"]
upstream-o2 = ["dep:vrl-o2"]

[dev-dependencies]
# The end-to-end lookup test reads an intake table through its witness parts.
lance-graph-intake = { path = "../lance-graph-intake" }
lance-graph-pg-row = { path = "../lance-graph-pg-row" }
# The row-type contract tests run the same predicate through Quack.
lance-graph-quack = { path = "../lance-graph-quack" }
# The r2il parity test only (tests/r2il_parity.rs): the same recipe as frozen
# F000 words, run through r2il's prepare/run. Execution never goes this way;
# r2il is the inspectable reading.
lance-graph-r2il = { path = "../lance-graph-r2il" }
