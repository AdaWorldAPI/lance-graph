[package]
name = "lance-graph-intake"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "Data as config, class as config: rows handed in as PostgreSQL prints them (column names, cells as text or NULL) have their column shapes detected, a class built and registered from them, the rows placed in source-owned lanes with a DR key map, and are answered through lance-graph-pg-row. Hand config wins over detection and every column gets a diff verdict."

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
lance-graph-quack = { path = "../lance-graph-quack" }
lance-graph-pg-row = { path = "../lance-graph-pg-row" }

[dev-dependencies]
pg-parity-harness = { path = "../pg-parity-harness" }

[features]
# Disable runs for tests/intake.rs; each turns the PostgreSQL gate red and is a
# compile error outside a debug build.
disable-intake-signed = []
disable-intake-live = []
