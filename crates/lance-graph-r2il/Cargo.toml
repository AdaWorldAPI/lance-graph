[package]
name = "lance-graph-r2il"
version = "0.1.0"
edition = "2021"
publish = false
description = "The fold reading of R2IL executed over mask-risc: FoldDialect, an ogar-loco Dialect that turns R2IL calls into mask-risc Programs and runs them at each fold boundary. Extracted from r2il-mask-abi-probe (D-SQLP-1)."

# A workspace member: the root `Cargo.toml` patches the contract and ndarray
# git coordinates to their local paths, so there is one of each.

[dependencies]
# The only bulk execution engine.
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
# The interpreter seam and the R2IL opcode/arity table, by git `main`, the
# coordinate `lance-graph-ogar` uses: one `ogar-loco` in the workspace, and a
# repo that pulls lance-graph by git can still resolve it (a `../../../OGAR`
# path escapes the fetched repository; medcare-rs #565). The OGAR crates take
# the contract from git `main`; the root `[patch]` maps that to the member.
ogar-loco = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
ogar-r2il = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The execution-binding seam (`binding`): DT64 resolves and admits a method,
# this crate executes it. Both are zero-dep beyond the contract.
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-contract = { path = "../lance-graph-contract" }
