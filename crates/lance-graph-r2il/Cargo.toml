[package]
name = "lance-graph-r2il"
version = "0.1.0"
edition = "2021"
publish = false
description = "The fold reading of R2IL executed over mask-risc: FoldDialect, an ogar-loco Dialect that turns R2IL calls into mask-risc Programs and runs them at each fold boundary. Extracted from r2il-mask-abi-probe (D-SQLP-1)."

# Its OWN workspace root, like `r2il-mask-abi-probe`: it path-deps the OGAR
# sibling (`ogar-loco`, `ogar-r2il`), and no ordinary lance-graph workspace
# build should need that checkout. Verify via
# `cargo test --manifest-path crates/lance-graph-r2il/Cargo.toml`.
[workspace]

[dependencies]
# The only bulk execution engine.
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
# The interpreter seam and the R2IL opcode/arity table. By PATH, matching
# `r2il-mask-abi-probe`, so both crates see one `ogar-r2il` identity.
ogar-loco = { path = "../../../OGAR/crates/ogar-loco" }
ogar-r2il = { path = "../../../OGAR/crates/ogar-r2il" }

# Same patches as `r2il-mask-abi-probe`: one local contract identity, one
# local ndarray identity.
[patch."https://github.com/AdaWorldAPI/lance-graph"]
lance-graph-contract = { path = "../lance-graph-contract" }

[patch."https://github.com/AdaWorldAPI/ndarray"]
ndarray = { path = "../../../ndarray" }
