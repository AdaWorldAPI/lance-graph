[package]
name = "lance-graph-planner"
version = "0.1.0"
edition = "2021"
description = "Unified query planner: MUL+Compass -> Thinking Orchestration -> Graph Query Planning"
license = "Apache-2.0"

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

# Error handling
thiserror = "2"

# Async
tokio = { version = "1", features = ["rt", "sync"] }

# Logging
tracing = "0.1"

# Hardware acceleration layer (mandatory)
ndarray = { path = "../../../ndarray", default-features = false, features = ["std", "hpc-extras"] }

# Causal edge protocol (CausalEdge64, NarsTables, Pearl hierarchy)
causal-edge = { path = "../causal-edge" }

# p64: convergence point — both ndarray and lance-graph meet here
p64 = { path = "../../../ndarray/crates/p64" }

# p64-bridge: CausalEdge64 + bgz17 → CognitiveShader
p64-bridge = { path = "../p64-bridge" }

# bgz17: palette semiring codec (Base17 VSA, 121 tests)
bgz17 = { path = "../bgz17" }

# Contract: canonical trait surface (OrchestrationBridge, PlannerContract,
# thinking/nars/plan types). Zero-dep. Implemented in orchestration_impl.rs.
lance-graph-contract = { path = "../lance-graph-contract" }

# HTTP server (optional, behind "serve" feature)
axum = { version = "0.8", optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# D-BLW-1 (`examples/blw_tenant.rs`) — the REAL `MailboxSoaOwner`.
#
# **DEV-ONLY, and it must stay dev-only.** The harness needs the production
# owner (`cognitive_shader_driver::mailbox_soa::MailboxSoA`) because the
# alternative — a harness-local `MailboxSoaOwner` impl — is exactly the "new
# SoA" that §12.5 forbids and the fake-owner substitution D-BLW-1 exists to
# prevent (`cycle_driver.rs`'s `FakeOwner` has no row columns, so no lens
# reading real data can run over it).
#
# The edge is acyclic in the built graph: `cognitive-shader-driver`'s own
# dependency on `lance-graph-planner` is OPTIONAL and gated behind its
# `with-planner` feature, which is NOT enabled here (its `default = []`).
# Even if it were, a dev-dependency cycle is permitted by cargo — but do NOT
# enable `with-planner` from this edge just to reach `MailboxSoA::cast_on_behalf`:
# `owner_adapter::emit_bootstrap_intent` is the surface that performs the
# bootstrap rebind, and `cast_on_behalf` does not.
cognitive-shader-driver = { path = "../cognitive-shader-driver" }

# `jc` dev-dep RE-ADDED for D-BLW-3 (`examples/blw_fusion.rs` — the
# Horizontverschmelzung fusion falsifier, `.claude/board/exec-runs/
# dblw3-design-opus.md` §7 B5). It was previously removed with
# `examples/blw_lens_twin.rs` (the retired κ instrument; §12.3c) and had gone
# back to ZERO consumers. The constraint that made the earlier use safe still
# binds: **dev-only, never a production dependency of the planner.** `jc` is
# the INDEPENDENT reference frame a discrimination measure is graded against
# (§12.5 — "the `jc` additive constraint continues to hold"), and a measure
# cannot be its own oracle. Do NOT invert this edge, and do NOT modify
# `crates/jc` while using it as the oracle.
#
# SECOND consumer (2026-08-20): `strategy/stage25_census.rs` — the Stage-2.5
# consumer-filter census, `#[cfg(test)]` only. Same constraint, same direction:
# `jc::stats` consumes the census's observations and nothing feeds back. No
# planner code path reads `jc`, and none may — it is instrumentation, not a
# semantic dependency. (This edge already existed; the census did not add it.)
jc = { path = "../jc" }

[features]
default = []
jit = []
datafusion = []
serve = ["dep:axum", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "serve"
path = "src/serve.rs"
required-features = ["serve"]
