[package]
name = "lance-graph-vector"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Vector as an upstream of lance-graph, with lance-graph-vrl as the glue: one VRL program runs in Vector and, compiled by lance-graph-vrl, declares the intake profile its output lands in. The NDJSON route Vector's http sink posts to decodes each line once, checks the schema revision, drops duplicate event ids, and appends to the tenant's table."

[dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
lance-graph-intake = { path = "../lance-graph-intake" }
lance-graph-vrl = { path = "../lance-graph-vrl" }
# The wire format at the boundary only: each NDJSON line is decoded once into
# the row shape intake takes. `raw_value` keeps a number's own text, so a
# decimal never passes through f64.
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
lance-graph-quack = { path = "../lance-graph-quack" }
lance-graph-dt64 = { path = "../lance-graph-dt64" }
