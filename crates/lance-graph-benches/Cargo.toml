[package]
name = "lance-graph-benches"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks for lance-graph (not published)"

[dependencies]
lance-graph = { path = "../lance-graph", version = "0.5.3" }
lance = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
futures = "0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
# The stage probe (examples/cypher_stage_probe/) times each Cypher stage
# separately, so it calls DataFusion directly, and its Quack arm executes
# hand-lowered programs over the same data.
datafusion = { workspace = true }
serde_json = "1"
lance-graph-quack = { path = "../lance-graph-quack" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }

[[bench]]
name = "graph_execution"
harness = false
