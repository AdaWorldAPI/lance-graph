[package]
name = "lance-graph-benches"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks for lance-graph (not published)"

[dependencies]
lance-graph = { path = "../lance-graph", version = "0.5.3" }
lance = { workspace = true }
# `examples/lance_source_probe.rs` builds zone-map and B-tree indices.
lance-index = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
futures = "0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
# The stage probe (examples/cypher_stage_probe/) times each Cypher stage
# separately, so it calls DataFusion directly, and its Quack arm executes
# hand-lowered programs over the same data.
datafusion = { workspace = true }
serde_json = "1"
lance-graph-quack = { path = "../lance-graph-quack" }
# `benches/cypher_df_vs_quack.rs` answers the same Cypher through the Quack lowering.
lance-graph-cypher-quack = { path = "../lance-graph-cypher-quack" }
# `benches/cypher_df_vs_quack.rs` `angles` group: the DR256 lab arms.
dr256-ternlog-lab = { path = "../dr256-ternlog-lab" }
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-contract = { path = "../lance-graph-contract" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
# `examples/pred_scratch_probe.rs` (D-CMR-2b) calls the `ndarray::simd`
# compare and fold primitives directly for its scratch-free arm. Same package
# as mask-risc's git coordinate through the workspace `[patch]`.
ndarray = { path = "../../../ndarray", default-features = false, features = ["std"] }

[[bench]]
name = "graph_execution"
harness = false

[[bench]]
name = "cypher_df_vs_quack"
harness = false
