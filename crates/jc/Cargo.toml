[package]
name = "jc"
version = "0.1.0"
edition = "2021"
description = "Jirak-Cartan: five-pillar proof-in-code for binary-Hamming causal field computation"
license = "Apache-2.0"

# ndarray is MANDATORY — here and everywhere in lance-graph (operator ruling,
# 2026-09-02). It is the execution substrate: every numeric path is written
# against `ndarray::simd::{F64x8, F32x16, I16x32}::*`, whose scalar / AVX2 /
# AVX-512 / NEON / WASM backends are bit-exact behind one typed surface. JC
# certifies what is mathematically true; ndarray tells the machine how to
# execute it. A consumer-local scalar arithmetic path is not a fallback, it
# is a second arithmetic implementation, and is forbidden.
#
# The former "zero external deps in production" constitution is retired by
# that ruling. What remains standalone is the PROOF: no other crate's
# behaviour is a premise of any pillar. Workspace siblings that carry
# domain content (sigker) stay feature-gated so a pillar can be run alone.
[dependencies]
ndarray = { path = "../../../ndarray" }
sigker = { path = "../sigker", optional = true }

[features]
# Default build: ndarray only (mandatory). Pillar 11 opts in below.
default = []
# Activates Pillar 11 (Hambly-Lyons signature uniqueness) by pulling in the
# sigker workspace sibling. See `src/hambly_lyons.rs` for the probe + the
# DEFERRED fallback used when the feature is off.
hambly-lyons = ["dep:sigker"]

# Dev-only deps for cross-crate bridge examples.
[dev-dependencies]
lance-graph-contract = { path = "../lance-graph-contract" }
# `substrate_compare` example only — the on-demand P64-vs-V3 comparison drives
# the REAL Palette64 (compute) + NodeGuid (address) and records into the
# neural-debug runtime registry. Dev-deps: examples only, not the library.
p64 = { path = "../../../ndarray/crates/p64" }
neural-debug = { path = "../neural-debug" }

[[example]]
name = "prove_it"

[[example]]
name = "sigma_probe"

[[example]]
name = "probe_p1"

[[example]]
