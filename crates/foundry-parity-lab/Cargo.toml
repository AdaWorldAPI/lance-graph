# D-FOUNDRY-PARITY-1 LAB: a 64-store operating network bound through DT64 and
# answered by mask-RISC programs, against an independent scalar oracle and a
# materialized-object null model. Read-only operational evaluation only (Level
# R); no scenario overlay and no writeback. NOT a workspace member, nothing
# depends on it, no public contract. Verify with
#   cargo test --release --manifest-path crates/foundry-parity-lab/Cargo.toml
#   cargo run  --release --manifest-path crates/foundry-parity-lab/Cargo.toml --bin bench
# Evidence matrix: .claude/plans/foundry-parity-v1.md
[package]
name = "foundry-parity-lab"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "D-FOUNDRY-PARITY-1 lab: can source-owned planes, a DT64 lane binding and mask-RISC programs answer CanCook / CanFulfill / NetworkCapacity over 64 stores with exact oracle parity and correct refusals?"

# Own workspace root, like the other lab probes.
[workspace]

[dependencies]
# Consumed read-only through their public APIs; none is changed.
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
lance-graph-contract = { path = "../lance-graph-contract" }
# G6: the WHEN guard of a registered method lowers through relalg (SetProgram -> R2IL -> one mask-RISC program).
lance-graph-relalg = { path = "../lance-graph-relalg" }
# Arm C: the INT8 packed GEMM (ndarray#418), from the same coordinate
# mask-risc uses, so the graph keeps one ndarray package.
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", branch = "master", default-features = false, features = ["std"] }

# OGAR (via relalg -> r2il) depends on lance-graph-contract by git; patch it to
# the path crate so the graph holds ONE contract (relalg does the same).
[patch."https://github.com/AdaWorldAPI/lance-graph"]
lance-graph-contract = { path = "../lance-graph-contract" }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[profile.release]
debug = false
