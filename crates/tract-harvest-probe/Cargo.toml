# tract-harvest-probe — D-TRACT-HARVEST-0, lab only.
# Tract is a COLD, optional frontend here: it types an ONNX graph. The graph
# itself is laid onto a DR#3 tile (nodes = Identity, values = Property) and
# every node is resolved through a DT64 ON x WHEN x DO registry onto existing
# native functions (lance-graph-onnx aliases/inlines, ndarray). Execution never
# calls Tract, and no native crate depends on this one.
# Own [workspace] root, excluded from the lance-graph workspace. Run from here:
#   cargo test
#   cargo run --release --example stages     (per-stage provenance inventory)
#   cargo run --release --example cost       (cold/hot costs, reported not gated)
[package]
name = "tract-harvest-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Lab probe D-TRACT-HARVEST-0: ONNX graph as a DR#3 graph resolved through a DT64 ON x WHEN x DO registry onto existing native methods; Tract as cold typing frontend; ORT parity. Results only; no production path."

[workspace]

[dependencies]
tract-onnx = { git = "https://github.com/AdaWorldAPI/tract", branch = "main" }
lance-graph-onnx = { path = "../lance-graph-onnx" }
# The DR64 relation register, Boolean composition and the frame store.
dr-math-binding-probe = { path = "../dr-math-binding-probe" }
lance-graph-contract = { path = "../lance-graph-contract" }
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", branch = "master", default-features = false, features = ["std"] }
sha2 = "0.10"
# The protobuf types are tract-onnx's own (`tract_onnx::pb`); decoding them needs the trait.
prost = "0.14"
serde_json = "1"

# Tract's own workspace patches crates.io ndarray to the AdaWorldAPI fork; a
# dependent workspace must repeat it, so the graph holds ONE ndarray package
# (the coordinate lance-graph-onnx already uses).
[patch.crates-io]
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", branch = "master" }
