# lance-graph-ogar — the OGAR (Open Graph of Active Record) activation crate.
# EXCLUDED from the lance-graph workspace (own [workspace] root below).
#
# Clean separation (operator, 2026-06-20):
#   lance-graph-ontology  =  OGIT   (TTL/RDF hydration spine)
#   lance-graph-ogar      =  OGAR   (Active-Record Class / ClassView / adapters)
#
# This crate is the lance-graph-side ACTIVATION + re-export of OGAR's full AR
# surface. OGAR is the Active-Record Core and already speaks the contract:
#   ogar-vocab::Class               = the calcified AR shape (attributes + family
#                                     Associations); `canonical_concept_id` == ClassId
#   ogar-class-view::OgarClassView  impl lance_graph_contract::ClassView
#                                     (32 promoted concepts → ObjectView/render_rows)
#   ogar-ontology                   = prefix conventions + NiblePath identity routing
#   ogar-adapter-surrealql          = DEPRECATED, feature `surrealql-parser` only
#
# Auto-activation = Cargo presence: a build graph that pulls THIS crate gets the
# real OGAR Class/ClassView/codebook + the parity-guard (lib.rs): a COMPILE-TIME
# length fuse (`const _` assert that the mirror and `ogar_vocab::class_ids::ALL`
# have equal count — fires in ANY build, `cargo build` included) plus a runtime
# `parity::assert_codebook_parity()` for the full id/domain bijection (call it at
# consumer startup; also asserted by this crate's tests = the CI gate). A build
# WITHOUT this crate uses the contract's zero-dep mirror + the bare ClassView
# trait. OGAR never depends on the lance-graph ENGINE — only the zero-dep contract.
#
# ── ONE contract source (codex P2, PR #564) ──
# The canonical `lance-graph-contract` in-repo is the PATH copy (`crates/
# lance-graph-contract`) — what `lance-graph` and `symbiont` already path-dep.
# `ogar-class-view` (in the OGAR repo) hard-codes a `git` dep on
# `AdaWorldAPI/lance-graph#main` for ITS standalone build; Cargo treats path and
# git as DISTINCT crates even at the same version, so `OgarClassView` would impl a
# DIFFERENT `ClassView` than the engine expects. The `[patch]` below redirects
# that transitive git contract onto the SAME path copy, so this crate's standalone
# build has exactly one contract source = the path copy.
#
# CONSUMER REQUIREMENT (cargo limitation): `[patch]` only applies in the WORKSPACE
# ROOT. When an in-repo workspace root (e.g. `crates/symbiont`) adds
# `lance-graph-ogar`, THIS crate's `[patch]` is ignored — that root MUST repeat:
#   [patch."https://github.com/AdaWorldAPI/lance-graph"]
#   lance-graph-contract = { path = "../lance-graph-contract" }
# to unify ogar-class-view's transitive git contract onto its path copy. Without
# it the OgarClassView `impl ClassView` won't typecheck against the engine's.
#
# Build/verify:  cargo test --manifest-path crates/lance-graph-ogar/Cargo.toml
# ⊘ SurrealQL:  cargo test --manifest-path crates/lance-graph-ogar/Cargo.toml \
#                  --features surrealql-parser  (deprecated IR arm, no consumer)

[package]
name = "lance-graph-ogar"
version = "0.1.0"
edition = "2021"
publish = false
description = "OGAR (Open Graph of Active Record) activation crate: re-exports ogar-vocab Class/codebook + ogar-class-view (impl lance_graph_contract::ClassView) + ogar-ontology, with a codebook parity-guard against the contract's zero-dep ogar_codebook mirror. Auto-activates the real OGAR AR surface wherever it is compiled into the build (golden image / AR-aware consumers)."
license = "Apache-2.0"

# Own workspace root — keeps this crate out of the parent lance-graph workspace.
[workspace]

[features]
default = []
# DEPRECATED IR arm. The SurrealQL branch is NOT in use: measured zero
# consumers of the re-export in lance-graph, MedCare-rs and OGAR (2026-08-22).
# It stays reachable so the work does not vanish — but nothing pulls it unless
# a consumer names this feature.
#
# The feature NAME and MEANING are unchanged. What changed is that the adapter
# crate below is now `optional`, so this feature also has to pull it in
# (`dep:`) rather than only switching on its parser subfeature.
# `crates/symbiont` and `crates/cognitive-stack` request this feature by name;
# Cargo rejects a dependency spec naming a feature that does not exist, before
# compiling anything, so renaming it would have broken both golden-image roots.
surrealql-parser = ["dep:ogar-adapter-surrealql", "ogar-adapter-surrealql/surrealdb-parser"]
# serde passthrough for the OGAR IR types. Der SurrealQL-Anteil hängt am
# Feature, nicht am Default — `?/` aktiviert nur, wenn die Crate ohnehin da ist.
serde = ["ogar-vocab/serde", "ogar-adapter-surrealql?/serde"]

[dependencies]
# Contract surface (zero-dep): ClassView / ObjectView / ClassId / NodeGuid + the
# ogar_codebook wire-compat mirror the parity-guard checks. PATH copy = the
# canonical in-repo source (same as lance-graph / symbiont); the [patch] below
# folds ogar-class-view's transitive git contract onto it = ONE source.
# THIS crate is the armed tier (workspace-EXCLUDED, so its ogar-vocab path
# dep cannot break workspace load in CI): it owns the COUNT_FUSE + per-entry
# mirror parity + the authoritative-table roundtrip green light. The contract
# stays strictly zero-dep.
lance-graph-contract = { path = "../lance-graph-contract" }

# OGIT spine (the NamespaceBridge trait + registry + namespace/error types the
# OGAR-driven port bridges build on). The OGIT/OGAR seam: the bridges live HERE
# (OGAR) because they couple to ogar-vocab; the trait + registry they implement
# against live in lance-graph-ontology (OGIT). OGIT does NOT depend on OGAR.
lance-graph-ontology = { path = "../lance-graph-ontology" }

# ── OGAR Active-Record forks: git deps @ main ──
#
# ⊘ SUPERSEDED (2026-08-24, `medcare-rs` PR #565 Railway build failure —
# `error: no matching package named 'ogar-loco' found, location searched:
# Git repository https://github.com/AdaWorldAPI/lance-graph?branch=main`).
# The prior "NO PINS — operator policy (2026-07-07)" note below is a REAL
# policy this repo's own local/CI builds relied on, but it does not survive
# `lance-graph-ogar` being consumed as a `git` dependency by an EXTERNAL
# repo (medcare-analytics -> lance-graph-ogar via
# `git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main"`).
# Cargo clones a git-sourced crate into its own opaque checkout cache
# (`~/.cargo/git/checkouts/lance-graph-<hash>/<rev>/`); a `path =
# "../../../OGAR/..."` dependency inside it resolves relative to THAT
# cache directory, which has no OGAR sibling — nothing ever puts one
# there, regardless of how fresh either repo is on GitHub or on the
# builder's disk. This is a hard Cargo constraint (git sources cannot
# contain path dependencies that escape the fetched repository), not a
# missing sibling-checkout step. Fixed by switching to `git` deps here —
# the tradeoff the 2026-07-07 policy explicitly declined (a Cargo.lock rev
# pin, so the local "always current sibling" property is gone for THIS
# crate) is accepted because the alternative is "unconsumable by any
# external repo, ever." Local/in-sandbox development still resolves fine
# (Cargo fetches/caches the same public GitHub repo); what is lost is only
# the zero-lag reflection of uncommitted local OGAR edits.
#
# Prior text, retained for the historical record (regraded, not deleted):
# "matches symbiont's + cognitive-stack's pins so ALL golden-image roots
# resolve to ONE OGAR source. NO PINS — operator policy (2026-07-07): OGAR
# resolves as a PATH dep to the local sibling checkout /home/user/OGAR...
# A git dep always writes a rev pin into Cargo.lock; a path dep never
# does — the fuse (COUNT_FUSE) then always checks against the sibling's
# CURRENT state. symbiont / cognitive-stack use the same sibling paths, so
# all three resolve ONE OGAR copy (codex P2 on #648 intent preserved)."
# `symbiont` and `cognitive-stack` carry the SAME escaping-path shape and
# are NOT fixed by this commit (symbiont is separately marked deprecated /
# operator no-go; cognitive-stack is unaudited for external git-consumers)
# — tracked as a follow-up, not silently assumed fixed.
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
ogar-class-view = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
ogar-ontology = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The call ABI the 34 NARS recipes lower onto (`recipe_vocab`, D-ACR-9).
# ogar-loco is zero-dep and lance-graph-contract is zero-dep; neither may
# import the other, so the vocabulary that needs both lives HERE.
ogar-loco = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The 19-predicate DisMech causal palette (`ogar_dismech::RELATIONS`, FnIndex
# 0x90..=0xA2) — the AUTHORITY the contract's zero-dep
# `dismech_evidence::DISMECH_PREDICATES` mirror is fused against here
# (`parity::assert_dismech_palette_parity`). Same split as the codebook: the
# mirror lives in the zero-dep contract so a replay core can name an ordinal's
# domain; the drift fuse lives in this armed tier, where the real palette is
# reachable. D-DCR-1 (W1) membrane half.
ogar-dismech = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# ⊘ DEPRECATED IR-Arm (Operator, 2026-08-22): "SurrealQL wird gar nicht
# verwendet, auch nicht ogar-*surreal*". OPTIONAL und aus dem unbedingten
# Dependency-Satz heraus — ein Build, der das Feature nicht nennt, zieht die
# Crate nicht mehr, und der Re-Export existiert dann nicht.
ogar-adapter-surrealql = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main", optional = true }

# Fold ogar-class-view's transitive `lance-graph-contract` (git
# AdaWorldAPI/lance-graph#main) onto the SAME path copy this crate uses, so there
# is exactly ONE contract crate and `OgarClassView`'s `impl ClassView` is for it
# (codex P2, PR #564). Applies in THIS crate's standalone build (its own
# [workspace] root); an in-repo workspace root that adds this crate must repeat
# the patch (see the CONSUMER REQUIREMENT note in the header).
[patch."https://github.com/AdaWorldAPI/lance-graph"]
lance-graph-contract = { path = "../lance-graph-contract" }

[dev-dependencies]
# TTL fixtures for the moved bridge scope-lock / codebook-convergence tests
# stage on-disk via tempfile::tempdir() + std::fs (matches lance-graph-ontology).
tempfile = "3"
