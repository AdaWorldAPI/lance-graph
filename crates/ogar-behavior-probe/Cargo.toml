# P2 / P3 / P9 of the mandatory-codegraph co-research map
# (.claude/board/entries/2026-10-31-coresearch-mandatory-codegraph.md).
# LAB: own workspace, NOT a member of the lance-graph workspace, nothing
# depends on it. Verify with
#   cargo test --manifest-path crates/ogar-behavior-probe/Cargo.toml
[package]
name = "ogar-behavior-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Measures what the existing OGAR structures can express about method behaviour: a body revision over ogar-loco::Program, a cold projection of ActionDef onto the DT64 MethodBinding contract, and a coverage census. Adds no type outside this crate."

[workspace]

[dependencies]
# All consumed read-only through their public APIs; none is changed.
ogar-vocab = { path = "../../../OGAR/crates/ogar-vocab" }
ogar-loco = { path = "../../../OGAR/crates/ogar-loco" }
ogar-from-ruff = { path = "../../../OGAR/crates/ogar-from-ruff" }
lance-graph-dt64 = { path = "../lance-graph-dt64" }
lance-graph-contract = { path = "../lance-graph-contract" }
# The same frontend ogar-from-ruff's own kausal-parity test uses, on the same
# coordinate (git main), so ruff_spo_triplet unifies to one package.
ruff_python_spo = { git = "https://github.com/AdaWorldAPI/ruff", branch = "main" }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
