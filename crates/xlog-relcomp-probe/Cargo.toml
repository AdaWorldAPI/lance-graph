# D-XLOG-DR64-0: isolated, test-only CPU interop probe. NOT a workspace member,
# NOT a runtime. Verify with
#   cargo test --release --manifest-path crates/xlog-relcomp-probe/Cargo.toml
[package]
name = "xlog-relcomp-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Lowers a restricted, XLOG-compiled RIR (BrainyBlaze/xlog, CPU-only crates) onto the existing DR64 Boolean relation register and compose kernel (dr-math-binding-probe), and checks it against independent references."

# Own workspace root: XLOG's xlog-core pins arrow 60, the lance stack pins
# arrow 58. Keeping this out of the lance-graph graph is the point.
[workspace]

[dependencies]
# The existing native relation register, binding guards and compose kernel.
# Consumed read-only through its public API.
dr-math-binding-probe = { path = "../dr-math-binding-probe" }
# The execution path: the ndarray::simd polyfill, on the coordinate
# lance-graph-onnx and lance-graph-mask-risc use.
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", branch = "master", default-features = false, features = ["std"] }
# DR's global -> local map for the answer axis (lance_graph_dt64::dr::LocalMap).
lance-graph-dt64 = { path = "../lance-graph-dt64" }
# D-DYNBAG-0: the description (Quack) and its one evaluator (mask-risc).
# Folds run there, never as direct ndarray::simd calls from this crate.
# The computation: XLOG's admitted chain over Quack -> mask-risc (D-XLOG-NATIVE-4).
lance-graph-xlog = { path = "../lance-graph-xlog" }
lance-graph-quack = { path = "../lance-graph-quack" }
lance-graph-mask-risc = { path = "../lance-graph-mask-risc" }
# `Population`, read off the admitted `MethodBinding` (D-DYNBAG-0 step 2).
lance-graph-contract = { path = "../lance-graph-contract" }
# XLOG's CUDA-free compiler crates, pinned to one upstream commit
# (MIT OR Apache-2.0; notices in the upstream repository).
xlog-core = { git = "https://github.com/BrainyBlaze/xlog", rev = "bff6da663308190148c5ce58a715d86525b62e67" }
xlog-ir = { git = "https://github.com/BrainyBlaze/xlog", rev = "bff6da663308190148c5ce58a715d86525b62e67" }
xlog-logic = { git = "https://github.com/BrainyBlaze/xlog", rev = "bff6da663308190148c5ce58a715d86525b62e67" }

[dev-dependencies]
# The shared contract types a DTO binding is stated in (NodeGuid, ClassView,
# WideFieldMask). Same path crate dr-math-binding-probe already uses.
lance-graph-contract = { path = "../lance-graph-contract" }
# CausalEdge64, for the Epi5 reading of XLOG results (tests/epi5_reading.rs).
causal-edge = { path = "../causal-edge" }
# egglog, on the coordinate dr-math-binding-probe already uses, for the
# shared-relation experiment (tests/shared_relation.rs): equality with proofs
# over the same DR64 register the closure reads.
egglog = { git = "https://github.com/AdaWorldAPI/egglog", branch = "main" }

[patch."https://github.com/AdaWorldAPI/lance-graph"]
lance-graph-contract = { path = "../lance-graph-contract" }
