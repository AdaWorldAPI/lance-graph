# D-GLOBAL-WHERE P1 probe: working-set construction, routing arms, cost model.
# Lab only. Own [workspace]; the root workspace never builds it. Consumes
# dt64, quack, mask-risc and ndarray::simd unchanged.
[package]
name = "d-global-where-p1-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
lance-graph-contract = { path = "../../../../crates/lance-graph-contract" }
lance-graph-dt64 = { path = "../../../../crates/lance-graph-dt64" }
lance-graph-quack = { path = "../../../../crates/lance-graph-quack" }
lance-graph-mask-risc = { path = "../../../../crates/lance-graph-mask-risc" }
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", branch = "master", default-features = false, features = ["std"] }

[patch."https://github.com/AdaWorldAPI/lance-graph"]
lance-graph-contract = { path = "../../../../crates/lance-graph-contract" }

[patch."https://github.com/AdaWorldAPI/ndarray"]
ndarray = { path = "/home/user/ndarray" }

[profile.release]
debug = 0

[workspace]
